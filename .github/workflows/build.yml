name: Build Regnvakt iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create clean Regnvakt app icon
        run: |
          python3 -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/pip install --quiet pillow
          /tmp/icon-venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math
          S = 1024
          im = Image.new("RGB", (S, S))
          px = im.load()
          for y in range(S):
              for x in range(S):
                  # Deep navy atmospheric gradient with a subtle cyan horizon.
                  glow = max(0.0, 1.0 - math.sqrt(((x-512)/760)**2 + ((y-470)/760)**2))
                  storm = max(0.0, 1.0 - abs(y-140)/500)
                  px[x,y] = (int(2+4*glow), int(13+30*glow+5*storm), int(34+55*glow+20*storm))
          d = ImageDraw.Draw(im, "RGBA")
          # Radar rings and sweep marks.
          for r, a, w in [(440,65,5),(365,75,5),(285,45,3)]:
              d.ellipse((512-r,512-r,512+r,512+r), outline=(0,174,255,a), width=w)
          d.line((512,54,512,205), fill=(0,194,255,170), width=5)
          d.line((512,819,512,970), fill=(0,194,255,170), width=5)
          d.line((54,512,205,512), fill=(0,194,255,170), width=5)
          d.line((819,512,970,512), fill=(0,194,255,170), width=5)
          # Shield silhouette with cyan edge.
          shield=[(512,170),(805,280),(780,600),(690,760),(512,875),(334,760),(244,600),(219,280)]
          d.polygon(shield, fill=(3,31,72,255), outline=(48,220,255,255), width=15)
          # Inner shield highlight.
          d.line(shield+[shield[0]], fill=(103,245,255,125), width=5, joint="curve")
          # Raindrops.
          def drop(cx,cy,scale):
              pts=[(cx,cy-scale),(cx-scale*.56,cy+scale*.12),(cx-scale*.48,cy+scale*.62),(cx,cy+scale*.9),(cx+scale*.48,cy+scale*.62),(cx+scale*.56,cy+scale*.12)]
              d.polygon(pts, fill=(55,205,255,235))
              d.ellipse((cx-scale*.22,cy-scale*.05,cx-scale*.02,cy+scale*.35), fill=(225,250,255,210))
          drop(512,315,57); drop(395,380,36); drop(629,380,36)
          # Umbrella canopy.
          d.pieslice((290,425,734,730),180,360,fill=(238,250,255,255),outline=(67,207,255,255),width=8)
          d.polygon([(290,578),(386,578),(438,625),(512,578),(586,625),(638,578),(734,578),(690,648),(638,625),(586,682),(512,625),(438,682),(386,625),(334,648)], fill=(238,250,255,255))
          # Canopy seams.
          d.line((512,426,438,625), fill=(28,142,206,255), width=9)
          d.line((512,426,586,625), fill=(28,142,206,255), width=9)
          # Umbrella shaft and curved handle.
          d.line((512,580,512,760), fill=(238,250,255,255), width=18)
          d.arc((440,715,530,805),0,180,fill=(238,250,255,255),width=18)
          # Subtle glow and rounded app tile.
          glow=Image.new("RGBA",(S,S),(0,0,0,0))
          gd=ImageDraw.Draw(glow)
          gd.ellipse((205,155,819,875),outline=(0,190,255,90),width=32)
          glow=glow.filter(ImageFilter.GaussianBlur(28))
          im=Image.alpha_composite(im.convert("RGBA"),glow)
          im=im.convert("RGB")
          # iOS applies its own rounded mask; keep the source square and full bleed.
          im.save("VADER/Assets.xcassets/AppIcon.appiconset/AppIcon.png", optimize=True)
          print("Created original 1024x1024 Regnvakt icon (no text, no legacy artwork)")
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS device
        run: |
          xcodebuild \
            -project VADER.xcodeproj \
            -scheme VADER \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Regnvakt.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VÄDRA.app"
          fi
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VADER.app"
          fi
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry VADER-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VADER-unsigned-IPA
          path: build/ipa/VADER-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
