<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06213e"/><stop offset=".48" stop-color="#075080"/><stop offset="1" stop-color="#020d20"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9fbff"/><stop offset=".35" stop-color="#00d9ff"/><stop offset=".7" stop-color="#0879c8"/><stop offset="1" stop-color="#7ef7ff"/></linearGradient>
 <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18edff"/><stop offset=".5" stop-color="#0079c9"/><stop offset="1" stop-color="#63eaff"/></linearGradient>
 <linearGradient id="canopy" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#c8f1ff"/><stop offset="1" stop-color="#5bb8f4"/></linearGradient>
 <linearGradient id="drop" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#eaffff"/><stop offset=".25" stop-color="#4ceaff"/><stop offset=".65" stop-color="#00a9f4"/><stop offset="1" stop-color="#004caa"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffbd2"/><stop offset=".4" stop-color="#ffc04a"/><stop offset="1" stop-color="#ff7a23" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
